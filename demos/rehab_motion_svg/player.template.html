<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>康复动作 · SVG 骨架示范</title>
<style>
:root{--ink:#23342f;--muted:#73817b;--paper:#f5f6f1;--green:#237f6d;--green-light:#eaf3ec;--orange:#ca663e;--orange-light:#fbefe7;--line:#dfe5dc}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #88b7a3;outline-offset:4px}button{border:0}main{max-width:1280px;margin:0 auto;padding:36px 38px 25px}.mast{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{font-size:12px;letter-spacing:2px;font-weight:700;display:flex;align-items:center;gap:10px}.brand i{width:10px;height:10px;background:var(--green);display:inline-block;border-radius:50%}.edition{color:var(--muted);font-size:12px;letter-spacing:1px}.hero{display:flex;justify-content:space-between;align-items:center;gap:20px}.eyebrow{font-size:12px;color:var(--green);font-weight:600;letter-spacing:2px;margin:0 0 10px}h1{font-size:34px;font-weight:600;letter-spacing:-1px;margin:0 0 10px}.intro{font-size:14px;color:#6c7972;line-height:1.8;margin:0}.exercise-tabs{display:flex;border:1px solid var(--line);border-radius:12px;padding:5px;gap:4px;background:#fff;flex-shrink:0}.exercise-tabs button{padding:12px 20px;border-radius:8px;background:transparent;color:var(--muted)}.exercise-tabs button.active{background:var(--ink);color:white}.workspace{margin-top:27px}.selector{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.selector-label{font-size:12px;color:var(--muted);margin-right:6px}.error-button{padding:9px 16px;border-radius:30px;background:transparent;color:#65756d;border:1px solid #dce2d8;font-size:13px}.error-button.active{color:#a74e29;border-color:#e6b89f;background:var(--orange-light)}.panels{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.card-head{padding:21px 25px 0;display:flex;justify-content:space-between;align-items:center}.card-title{font-size:18px;font-weight:600;margin:0;display:flex;gap:9px;align-items:center}.card-title .icon{font-size:15px;width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--green-light);color:var(--green)}.bad .card-title .icon{background:var(--orange-light);color:var(--orange)}.pill{font-size:11px;letter-spacing:.6px;padding:6px 9px;border-radius:5px;color:var(--green);background:var(--green-light)}.bad .pill{color:var(--orange);background:var(--orange-light)}.card-desc{margin:9px 25px 0;color:var(--muted);font-size:13px;height:20px}.stage{display:block;width:100%;height:396px}.card-foot{display:flex;align-items:center;gap:8px;margin:0 25px 20px;color:#728278;font-size:12px}.swatch{display:inline-block;width:18px;height:3px;background:var(--green);border-radius:2px}.bad .swatch{background:var(--orange)}.reference-key{margin-left:auto;display:flex;align-items:center;gap:7px}.reference-key i{width:20px;border-top:2px dashed #b6c3b9}.transport{margin-top:18px;padding:18px 21px;border:1px solid var(--line);border-radius:15px;background:#fff;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px}.play-group{display:flex;gap:8px}.play{width:42px;height:42px;border-radius:50%;color:#fff;background:var(--green);font-size:17px}.restart{width:38px;height:42px;border-radius:50%;background:transparent;color:#6c7b73;font-size:22px}.timeline-wrap{min-width:0}.timeline-caption{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px;font-variant-numeric:tabular-nums}.timeline{display:block;width:100%;accent-color:var(--green);cursor:pointer;height:6px;margin:0}.speed{border:1px solid var(--line);border-radius:7px;padding:8px 6px;background:#fff;font-size:12px;color:#53685d}.options{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:17px;flex-wrap:wrap}.view-tools{display:flex;align-items:center;gap:7px}.option-caption{font-size:12px;color:var(--muted);margin-right:3px}.view-button{font-size:12px;color:#728176;background:transparent;padding:7px 11px;border-radius:7px}.view-button.active{background:#e5ece2;color:var(--ink)}.ghost-label{font-size:12px;color:#65786b;display:flex;align-items:center;gap:7px;cursor:pointer}.ghost-label input{accent-color:var(--green)}.note{border-top:1px solid var(--line);margin-top:23px;padding-top:15px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.note p{margin:0;font-size:11px;color:#829084;line-height:1.9}.note strong{font-weight:500;color:#617367}.source{font-family:Consolas,monospace;font-size:10px!important;text-align:right;white-space:nowrap}.view-readout{font-size:10px;letter-spacing:1px;fill:#91a095}.svg-caption{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#819184;font-size:10px}.hint-box{fill:#fff;stroke:#e4e9df}.hint-text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#a65d3c;font-size:11px}.download-link{color:var(--green);text-decoration:none;border-bottom:1px solid #c3d5c6}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:760px){main{padding:24px 16px}.mast{margin-bottom:25px}.hero{align-items:flex-start;flex-direction:column}h1{font-size:29px}.exercise-tabs{margin-top:9px}.panels{gap:12px}.card-head{padding:16px 14px 0}.card-title{font-size:15px}.pill{font-size:9px}.card-desc{font-size:11px;margin-left:14px;margin-right:14px;height:33px;line-height:1.6}.stage{height:300px}.card-foot{margin:0 14px 16px;font-size:10px}.reference-key{display:none}.transport{padding:14px 12px;gap:10px}.note{flex-direction:column}.source{text-align:left}.error-button{padding:8px 12px;font-size:12px}.edition{font-size:10px}}
@media(max-width:470px){.panels{grid-template-columns:1fr}.stage{height:350px}.card-desc{height:auto}.brand{font-size:10px}.edition{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
@media(max-width:760px){.mast{align-items:flex-start;flex-direction:column;gap:12px}.mast .exercise-tabs{margin-top:0}.brand{white-space:nowrap}}
</style>
</head>
<body>
<main>
  <header class="mast"><div class="brand"><i></i>REHAB / MOTION STUDY</div><nav class="exercise-tabs" aria-label="展示来源"><button type="button" data-source="schematic" class="active" aria-pressed="true">动作原理示意</button><button type="button" data-source="recorded" aria-pressed="false">真实数据回放</button></nav></header>
  <section class="hero"><div><p class="eyebrow">观察动作，也观察代偿</p><h1>看懂每一次动作</h1><p class="intro" id="intro">肩后伸 · 同步比较标准动作与常见错误，留意躯干、肩部和手臂的变化。</p></div><nav class="exercise-tabs" aria-label="选择动作"><button type="button" data-ex="7" class="active" aria-pressed="true">肩后伸</button><button type="button" data-ex="1" aria-pressed="false">肩外展</button></nav></section>
  <section class="workspace" aria-label="动作对照播放器">
    <div class="selector" id="error-selector" aria-label="选择错误类型"></div>
    <div class="panels">
      <article class="card"><div class="card-head"><h2 class="card-title"><span class="icon">✓</span>标准动作</h2><span class="pill">正确标注示例</span></div><p class="card-desc" id="good-desc"></p><svg class="stage" id="good-svg" viewBox="0 0 480 470" role="img" aria-label="标准动作骨架动画"></svg><div class="card-foot"><span class="swatch"></span>关节连接与手腕轨迹<span class="reference-key"><i></i>起始姿态</span></div></article>
      <article class="card bad"><div class="card-head"><h2 class="card-title"><span class="icon">!</span><span id="bad-title">躯干前倾</span></h2><span class="pill">错误标注示例</span></div><p class="card-desc" id="bad-desc"></p><svg class="stage" id="bad-svg" viewBox="0 0 480 470" role="img" aria-label="错误动作骨架动画"></svg><div class="card-foot"><span class="swatch"></span>橙色为需关注的部位<span class="reference-key"><i></i>同进度标准姿态</span></div></article>
    </div>
    <div class="transport"><div class="play-group"><button type="button" class="play" id="play" aria-label="暂停" title="播放 / 暂停（空格）">Ⅱ</button><button type="button" class="restart" id="restart" aria-label="从头播放" title="从头播放">↺</button></div><div class="timeline-wrap"><div class="timeline-caption"><span>同步动作进度</span><span id="progress-text">00%</span></div><input class="timeline" id="progress" type="range" min="0" max="1000" value="0" aria-label="动作进度"></div><select class="speed" id="speed" aria-label="播放速度"><option value="0.5">0.5× 慢速</option><option value="1" selected>1× 速度</option><option value="1.5">1.5× 速度</option></select></div>
    <div class="options"><div class="view-tools"><span class="option-caption">观察视角</span><button class="view-button" type="button" data-view="front">正面</button><button class="view-button active" type="button" data-view="oblique">斜侧</button><button class="view-button" type="button" data-view="side">侧面</button></div><label class="ghost-label"><input type="checkbox" id="ghost" checked>叠加标准姿态参考</label></div>
  </section>
  <footer class="note"><p><strong id="source-kind">动作原理示意 · 33 点骨架</strong><br><span id="source-note">用简化动作突出标准与代偿的差异；具体幅度为绘图示意。橙色为关注部位，不代表模型检测。</span><br><a class="download-link" href="shoulder_extension_comparison.svg">肩后伸独立 SVG</a>　·　<a class="download-link" href="shoulder_abduction_comparison.svg">肩外展独立 SVG</a></p><p class="source" id="source"></p></footer>
</main>
<script>
const SCHEMATIC_DATA = /*__SCHEMATIC_DATA__*/;
const RECORDED_DATA = /*__MOTION_DATA__*/;
let DATA = SCHEMATIC_DATA;
const EDGES = [[1,2],[2,3],[3,7],[4,5],[5,6],[6,8],[9,10],[11,12],[11,13],[13,15],[15,17],[15,19],[15,21],[17,19],[12,14],[14,16],[16,18],[16,20],[16,22],[18,20],[11,23],[12,24],[23,24],[23,25],[25,27],[27,29],[29,31],[27,31],[24,26],[26,28],[28,30],[30,32],[28,32]];
const state = {source:'schematic',exercise:'7',error:'ERR_TORSO_FORWARD',progress:0,playing:!matchMedia('(prefers-reduced-motion: reduce)').matches,speed:1,view:'oblique',ghost:true};
const $ = s => document.querySelector(s);
const n = v => v.toFixed(2);
let previousTime = null;
function current(){return DATA.exercises[state.exercise]}
function yaw(){return {front:0,oblique:state.exercise==='7'?65:30,side:90}[state.view] * Math.PI / 180}
function scaleForExercise(){let radius=0,height=0;for(const clip of Object.values(current().clips))for(const pose of clip.points)for(const p of pose){radius=Math.max(radius,Math.hypot(p[0],p[2]));height=Math.max(height,-p[1]);}return Math.min(365/height,190/radius,105)}
let scale=scaleForExercise();
function project(p){const t=yaw();return [240+(p[0]*Math.cos(t)+p[2]*Math.sin(t))*scale,425+p[1]*scale,-p[0]*Math.sin(t)+p[2]*Math.cos(t)]}
function sample(clip,progress){const frame=Math.max(0,Math.min(95,progress*95)),a=Math.floor(frame),b=Math.min(95,a+1),f=frame-a;return clip.points[a].map((p,j)=>p.map((v,k)=>v*(1-f)+clip.points[b][j][k]*f))}
function skeleton(pose,highlight=[],ghost=false){const points=pose.map(project),targets=new Set(highlight);let out='';const edges=[...EDGES].sort((a,b)=>(points[a[0]][2]+points[a[1]][2])-(points[b[0]][2]+points[b[1]][2]));
 const face=[0,7,8].map(j=>points[j]),cx=(Math.min(...face.map(p=>p[0]))+Math.max(...face.map(p=>p[0])))/2,cy=(Math.min(...face.map(p=>p[1]))+Math.max(...face.map(p=>p[1])))/2,rx=Math.max(8,(Math.max(...face.map(p=>p[0]))-Math.min(...face.map(p=>p[0])))/2+4),ry=Math.max(10,(Math.max(...face.map(p=>p[1]))-Math.min(...face.map(p=>p[1])))/2+5),headColor=ghost?'#b7c6b9':highlight.some(j=>j<11)?'#cc6a41':highlight.length?'#78938b':'#248c78';
 out+=`<line x1="${n((points[11][0]+points[12][0])/2)}" y1="${n((points[11][1]+points[12][1])/2)}" x2="${n(cx)}" y2="${n(cy+ry)}" stroke="${headColor}" stroke-width="${ghost?1.5:2}" opacity="${ghost?.35:.7}"/><ellipse cx="${n(cx)}" cy="${n(cy)}" rx="${n(rx)}" ry="${n(ry)}" fill="none" stroke="${headColor}" stroke-width="${ghost?1.3:1.8}" opacity="${ghost?.35:.8}"/>`;
 for(const [a,b] of edges){const focus=!ghost&&(targets.has(a)||targets.has(b))&&!(a>=25||b>=25);const color=ghost?'#b7c6b9':focus?'#cc6a41':highlight.length?'#78938b':'#248c78';const width=ghost?1.7:(a<11&&b<11?1.5:3.5);out+=`<line x1="${n(points[a][0])}" y1="${n(points[a][1])}" x2="${n(points[b][0])}" y2="${n(points[b][1])}" stroke="${color}" stroke-width="${width}" stroke-linecap="round" ${ghost?'stroke-dasharray="4 5" opacity=".45"':''}/>`}
 if(!ghost)for(let j=0;j<points.length;j++){const p=points[j],focus=targets.has(j);out+=`<circle cx="${n(p[0])}" cy="${n(p[1])}" r="${j<11?1.9:3.6}" fill="${focus?'#cf6b41':'#fff'}" stroke="${focus?'#b8542e':highlight.length?'#77978c':'#348c76'}" stroke-width="${j<11?1:1.5}"/>`}
 return out;
}
function trail(clip,joint,color){return `<path d="${clip.points.filter((_,i)=>i%2===0).map((p,i)=>{const q=project(p[joint]);return `${i?'L':'M'}${n(q[0])} ${n(q[1])}`}).join(' ')}" fill="none" stroke="${color}" stroke-width="1.5" opacity=".22" stroke-linecap="round"/>`}
function stage(svg,clip,isBad){let s=`<defs><pattern id="grid-${isBad}" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r=".7" fill="#e8ede4"/></pattern></defs><rect x="20" y="20" width="440" height="425" rx="10" fill="url(#grid-${isBad})"/><ellipse cx="240" cy="428" rx="82" ry="8" fill="#eff2eb"/><line x1="80" y1="432" x2="400" y2="432" stroke="#dce4d8"/><text x="30" y="42" class="view-readout">${state.view==='front'?'FRONT VIEW':state.view==='side'?'SIDE VIEW':'OBLIQUE VIEW'}</text>`;
 s+=trail(clip,15,isBad?'#cf6d45':'#258b78')+trail(clip,16,isBad?'#cf6d45':'#258b78');
 if(isBad&&state.ghost)s+=skeleton(sample(current().clips.correct,state.progress),[],true);
 if(!isBad)s+=skeleton(clip.points[0],[],true);
 s+=skeleton(sample(clip,state.progress),isBad?clip.highlight:[]);
 s+=`<text x="240" y="456" text-anchor="middle" class="svg-caption">${state.exercise==='7'?'手臂后伸 · 观察躯干是否保持稳定':'手臂外展 · 观察抬臂轨迹与幅度'}</text>`;
 svg.innerHTML=s;
}
function render(){const ex=current(),bad=ex.clips[state.error];stage($('#good-svg'),ex.clips.correct,false);stage($('#bad-svg'),bad,true);$('#progress').value=Math.round(state.progress*1000);$('#progress-text').textContent=String(Math.round(state.progress*100)).padStart(2,'0')+'%';}
function syncUI(){const ex=current();$('#intro').textContent=`${ex.name} · 同步比较标准动作与常见错误，留意躯干、肩部和手臂的变化。`;$('#good-desc').textContent=ex.hint;$('#bad-title').textContent=ex.clips[state.error].name;$('#bad-desc').textContent=ex.clips[state.error].hint;$('#source').textContent=`正确：${ex.clips.correct.id}\n错误：${ex.clips[state.error].id}`;$('#source').style.whiteSpace='pre';$('#error-selector').innerHTML='<span class="selector-label">错误示范</span>'+ex.errors.map(code=>`<button type="button" class="error-button ${code===state.error?'active':''}" data-error="${code}" aria-pressed="${code===state.error}">${ex.clips[code].name}</button>`).join('');document.querySelectorAll('[data-ex]').forEach(b=>{b.classList.toggle('active',b.dataset.ex===state.exercise);b.setAttribute('aria-pressed',b.dataset.ex===state.exercise)});document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===state.view);b.setAttribute('aria-pressed',b.dataset.view===state.view)});$('#play').textContent=state.playing?'Ⅱ':'▶';$('#play').setAttribute('aria-label',state.playing?'暂停':'播放');render();}
function setExercise(ex){state.exercise=String(ex);state.error=current().errors[0];state.view=state.exercise==='7'?'oblique':'front';state.progress=0;scale=scaleForExercise();syncUI()}
function setSource(source){state.source=source;DATA=source==='recorded'?RECORDED_DATA:SCHEMATIC_DATA;state.progress=0;scale=scaleForExercise();syncUI()}
function setError(code){if(!current().clips[code])throw Error('Unknown error '+code);state.error=code;syncUI()}
function setProgress(p){state.progress=Math.max(0,Math.min(1,p));render()}
function setPlaying(value){state.playing=value;previousTime=null;syncUI()}
document.querySelectorAll('[data-ex]').forEach(b=>b.addEventListener('click',()=>setExercise(b.dataset.ex)));
document.querySelectorAll('[data-source]').forEach(b=>b.addEventListener('click',()=>setSource(b.dataset.source)));
$('#error-selector').addEventListener('click',e=>{const b=e.target.closest('[data-error]');if(b)setError(b.dataset.error)});
document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;syncUI()}));
$('#play').addEventListener('click',()=>setPlaying(!state.playing));$('#restart').addEventListener('click',()=>{setProgress(0);setPlaying(true)});
$('#progress').addEventListener('input',e=>{const p=Number(e.target.value)/1000;setPlaying(false);setProgress(p)});
$('#speed').addEventListener('change',e=>{state.speed=Number(e.target.value)});$('#ghost').addEventListener('change',e=>{state.ghost=e.target.checked;render()});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();setPlaying(!state.playing)}});
function tick(time){if(previousTime!==null&&state.playing){state.progress=(state.progress+Math.min((time-previousTime)/1000,.1)*state.speed/DATA.duration)%1;render()}previousTime=time;requestAnimationFrame(tick)}
const syncContentUI=syncUI;
syncUI=function(){syncContentUI();const recorded=state.source==='recorded';document.querySelector('.card .pill').textContent=recorded?'正确标注示例':'标准动作示意';document.querySelector('.bad .pill').textContent=recorded?'错误标注示例':'错误动作示意';$('#source-kind').textContent=recorded?'REHAB26 标注片段 · 同一参与者 · 三视角等权融合骨架':'动作原理示意 · 33 点骨架';$('#source-note').textContent=recorded?'按动作进度同步；为便于观察，仅对显示轨迹轻度平滑。橙色依错误标签标示，不代表模型实时检测。':'用简化动作突出标准与代偿的差异；具体幅度为绘图示意。橙色为关注部位，不代表模型检测。';document.querySelectorAll('[data-source]').forEach(b=>{b.classList.toggle('active',b.dataset.source===state.source);b.setAttribute('aria-pressed',b.dataset.source===state.source)})};
window.motionDemo={state,setExercise,setError,setSource,setProgress,setPlaying,render,get DATA(){return DATA}};syncUI();requestAnimationFrame(tick);
</script>
</body>
</html>
